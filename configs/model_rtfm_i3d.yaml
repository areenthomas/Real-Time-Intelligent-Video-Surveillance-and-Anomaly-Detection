model:
  name: "RTFM_I3D"
  backbone: "I3D"
  pretrained_weights: "kinetics400"
  feature_dim: 2048
  projection_dim: 512
  segments_per_bag: 32

temporal_module:
  type: "PyramidDilatedConv"
  dilations: [1, 2, 4]
  kernel_size: 3
  dropout: 0.7

attention_module:
  enabled: true
  heads: 4
  hidden_dim: 512

loss:
  margin: 100.0 # Feature magnitude margin threshold (m)
  top_k: 3      # Top-k largest magnitude instances per bag
  weight_magnitude: 0.001
  weight_ranking: 1.0
  weight_smoothness: 0.00008
  weight_sparsity: 0.00008

training:
  batch_size: 32 # 32 normal bags + 32 abnormal bags
  epochs: 50
  optimizer: "Adam"
  learning_rate: 0.0001
  weight_decay: 0.0005
  lr_scheduler: "CosineAnnealingLR"
  seed: 42

